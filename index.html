<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EchoReport"><link rel="manifest" href="manifest.json"><title>EchoReport</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#dbe2ea;--accent:#1769e0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:14px 16px;box-shadow:0 2px 12px #0002}header .bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.75;margin-top:2px}main{max-width:1100px;margin:18px auto;padding:0 14px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0000000a}.card h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:600}select,input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e9eef5;color:var(--ink)}.report{white-space:pre-wrap;line-height:1.55;background:#0b1220;color:#e9eef7;border-radius:12px;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;min-height:120px}.conclusion{white-space:pre-wrap;line-height:1.55;background:#eef6ff;border:1px solid #cfe3ff;border-radius:12px;padding:15px}.smallcaps{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}footer{max-width:1100px;margin:auto;padding:0 14px 30px;color:var(--muted);font-size:12px}@media(max-width:600px){main{margin-top:10px}.card{padding:13px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="bar"><div><h1>EchoReport</h1><div class="sub">Générateur de compte-rendu échocardiographique</div></div><button class="btn secondary" id="reset">Réinitialiser</button></div></header><main id="app"></main><footer>EchoReport V6 — génération de texte uniquement. Aucun calcul ni interprétation automatique.</footer><script>
const S=[
['Ventricule gauche',[['lvSize','Taille du VG',['De taille normale','Discrètement dilaté','Modérément dilaté','Sévèrement dilaté','Mal visualisé']],['lvWall','Épaisseur pariétale',['Épaisseur pariétale normale','Hypertrophie du VG','Mal visualisé']],['lvType','Type d’hypertrophie',['Hypertrophie concentrique','Hypertrophie excentrique','Hypertrophie septale asymétrique','Hypertrophie septale basale (sigmoïde)','Hypertrophie apicale']],['bulge','Bourrelet baso-septal',['Absence de bourrelet baso-septal','Discret bourrelet baso-septal','Bourrelet baso-septal marqué']],['kine','Cinétique segmentaire',['Absence de trouble de la cinétique segmentaire','Trouble de la cinétique segmentaire','Mal visualisée']]]],
['Fonction systolique',[['ef','FEVG',['FEVG conservée','FEVG légèrement diminuée','FEVG modérément diminuée','FEVG sévèrement diminuée']],['efv','FEVG mesurée / estimée','input','ex. 55–60 %']]],
['Fonction diastolique et pressions de remplissage',[['dia','Fonction diastolique',['Fonction diastolique normale','Dysfonction diastolique de grade I','Dysfonction diastolique de grade II','Dysfonction diastolique de grade III','Fonction diastolique indéterminée']],['fill','Pressions de remplissage',['Pressions de remplissage normales','Pressions de remplissage élevées','Pressions de remplissage indéterminées']],['inflow','Flux mitral',['Normal','Relaxation altérée','Pseudonormal','Restrictif']],['ee','E/e’','input','ex. 9']]],
['Racine aortique et aorte ascendante tubulaire',[['aorta','Dimensions',['Dimensions normales','Dilatée','Mal visualisée']],['root','Diamètre racine aortique','input','mm'],['asc','Diamètre aorte ascendante tubulaire','input','mm'],['z','Z-score','input','ex. 1,8']]],
['Valve aortique',[['avvis','Visualisation',['Visualisation satisfaisante','Mal visualisée']],['avm','Morphologie',['Valve aortique tricuspide','Valve aortique bicuspide','Feuillets aortiques fins','Feuillets épaissis','Feuillets calcifiés','Mauvaise visualisation des feuillets aortiques','Une bicuspidie ne peut être exclue']],['avo','Ouverture',['Ouverture valvulaire conservée','Ouverture valvulaire diminuée','Ouverture valvulaire sévèrement diminuée']],['avs','Sténose',['Absence de sténose aortique','Sténose aortique discrète','Sténose aortique modérée','Sténose aortique sévère']],['avr','Insuffisance',['Absence d’insuffisance aortique','Insuffisance aortique discrète','Insuffisance aortique modérée','Insuffisance aortique sévère']]]],
['Valve mitrale',[['mvvis','Visualisation',['Visualisation satisfaisante','Mal visualisée']],['mvm','Morphologie',['Feuillets fins','Feuillets épaissis','Feuillets calcifiés','Feuillets remaniés']],['mvv','Mouvement',['Mouvement normal','Mouvement excessif','Prolapsus','Restriction','Ballonnement','Flail leaflet']],['mvo','Ouverture',['Ouverture valvulaire conservée','Ouverture valvulaire diminuée','Ouverture valvulaire sévèrement diminuée']],['mvs','Sténose',['Absence de sténose mitrale','Sténose mitrale discrète','Sténose mitrale modérée','Sténose mitrale sévère']],['mvr','Insuffisance',['Absence d’insuffisance mitrale','Insuffisance mitrale discrète','Insuffisance mitrale modérée','Insuffisance mitrale sévère']]]],
['Oreillette gauche',[['la','Taille',['De taille normale','Discrètement dilatée','Modérément dilatée','Sévèrement dilatée','Mal visualisée']],['laa','Surface planimétrique','input','cm²'],['lav','Volume indexé','input','mL/m²']]],
['Oreillette droite',[['ra','Taille',['De taille normale','Discrètement dilatée','Modérément dilatée','Sévèrement dilatée','Mal visualisée']],['raa','Surface planimétrique','input','cm²'],['rav','Volume indexé','input','mL/m²']]],
['Ventricule droit',[['rv','Taille du VD',['Le ventricule droit paraît de taille normale','Le ventricule droit paraît discrètement dilaté','Le ventricule droit paraît modérément dilaté','Le ventricule droit paraît sévèrement dilaté','Le ventricule droit est mal visualisé']],['rvf','Fonction systolique globale',['La fonction systolique globale du ventricule droit paraît conservée','La fonction systolique globale du ventricule droit paraît discrètement diminuée','La fonction systolique globale du ventricule droit paraît modérément diminuée','La fonction systolique globale du ventricule droit paraît sévèrement diminuée']],['paps','PAPs','input','mmHg'],['php','Probabilité échocardiographique d’HTP',['Probabilité faible','Probabilité possible','Probabilité probable']]]],
['Valve tricuspide',[['tvvis','Visualisation',['Visualisation satisfaisante','Mal visualisée']],['tvm','Morphologie',['Morphologie normale','Feuillets épaissis','Feuillets remaniés']],['tvo','Ouverture',['Ouverture valvulaire conservée','Ouverture valvulaire diminuée','Ouverture valvulaire sévèrement diminuée']],['tvr','Insuffisance',['Absence d’IT','IT discrète','IT modérée','IT sévère']],['tvs','Sténose',['Absence de sténose tricuspide','Sténose tricuspide discrète','Sténose tricuspide modérée','Sténose tricuspide sévère']]]],
['Valve pulmonaire',[['pvvis','Visualisation',['Visualisation satisfaisante','Mal visualisée']],['pvm','Morphologie',['Morphologie normale','Feuillets épaissis','Feuillets remaniés']],['pvo','Ouverture',['Ouverture valvulaire conservée','Ouverture valvulaire diminuée','Ouverture valvulaire sévèrement diminuée']],['pvr','Insuffisance',['Absence d’IP','IP discrète','IP modérée','IP sévère']],['pvs','Sténose',['Absence de sténose pulmonaire','Sténose pulmonaire discrète','Sténose pulmonaire modérée','Sténose pulmonaire sévère']]]],
['VCI',[['ivvis','Visualisation',['Visualisation satisfaisante','Mal visualisée']],['ivd','Diamètre','input','mm'],['ivc','Collapsus inspiratoire',['>50%','<50%','Non évalué']],['rap','Pression OD estimée',['3 mmHg','8 mmHg','15 mmHg','Non estimable']]]],
['Péricarde',[['pervis','Visualisation',['Visualisation satisfaisante','Mal visualisé']],['eff','Épanchement',['Absence d’épanchement péricardique','Épanchement péricardique minime','Épanchement péricardique léger','Épanchement péricardique modéré','Épanchement péricardique sévère']],['loc','Localisation',['Circonférentiel','Localisé']],['flow','Flux transvalvulaires / variation respiratoire',['Pas de variation respiratoire significative','Variation respiratoire significative du flux mitral','Variation respiratoire significative du flux tricuspide','Variation respiratoire significative du flux aortique','Variations respiratoires significatives des flux transvalvulaires']],['tam','Tamponnade / signes échographiques',['Absence de signe échographique de tamponnade','Collapsus de l’oreillette droite','Collapsus du ventricule droit','VCI pléthorique','Interdépendance ventriculaire','Tamponnade']]]]
];
const st={};const app=document.getElementById('app');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){app.innerHTML=S.map((sec,i)=>`<section class="card"><div class="smallcaps">Section ${i+1}</div><h2>${sec[0]}</h2><div class="grid">${sec[1].map(f=>f[2]==='input'?`<div class="field"><label>${esc(f[1])}</label><input id="${f[0]}" placeholder="${esc(f[3])}"></div>`:`<div class="field"><label>${esc(f[1])}</label><select id="${f[0]}"><option value="">Non renseigné</option>${f[2].map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div></section>`).join('')+`<div class="actions"><button class="btn primary" id="gen">Générer le rapport</button><button class="btn secondary" id="copy">Copier</button><button class="btn secondary" id="txt">Télécharger .txt</button></div><section class="card"><div class="smallcaps">Compte-rendu</div><h2>Rapport</h2><div id="report" class="report">Sélectionnez les éléments puis cliquez sur « Générer le rapport ».</div></section><section class="card"><div class="smallcaps">Synthèse</div><h2>Conclusion</h2><div id="conclusion" class="conclusion">La conclusion sera générée à partir des éléments renseignés.</div></section>`;document.querySelectorAll('select,input').forEach(e=>e.oninput=()=>st[e.id]=e.value);gen.onclick=generate;copy.onclick=copyAll;txt.onclick=downloadTxt}
function v(id){return st[id]||''}function line(id,x){if(!x)return '';const m={lvSize:{'De taille normale':'Ventricule gauche de taille normale.','Discrètement dilaté':'Ventricule gauche discrètement dilaté.','Modérément dilaté':'Ventricule gauche modérément dilaté.','Sévèrement dilaté':'Ventricule gauche sévèrement dilaté.','Mal visualisé':'Ventricule gauche mal visualisé.'},lvWall:{'Épaisseur pariétale normale':'Épaisseur pariétale du ventricule gauche normale.','Hypertrophie du VG':'Hypertrophie du ventricule gauche.','Mal visualisé':'Ventricule gauche mal visualisé.'},bulge:{'Absence de bourrelet baso-septal':'Absence de bourrelet baso-septal.','Discret bourrelet baso-septal':'Discret bourrelet baso-septal.','Bourrelet baso-septal marqué':'Bourrelet baso-septal marqué.'},kine:{'Absence de trouble de la cinétique segmentaire':'Absence de trouble de la cinétique segmentaire.','Trouble de la cinétique segmentaire':'Trouble de la cinétique segmentaire.','Mal visualisée':'Cinétique segmentaire mal visualisée.'},ef:{'FEVG conservée':'La fonction ventriculaire gauche est conservée.','FEVG légèrement diminuée':'La fonction ventriculaire gauche est légèrement diminuée.','FEVG modérément diminuée':'La fonction ventriculaire gauche est modérément diminuée.','FEVG sévèrement diminuée':'La fonction ventriculaire gauche est sévèrement diminuée.'},dia:{'Fonction diastolique normale':'Fonction diastolique normale.','Dysfonction diastolique de grade I':'Dysfonction diastolique de grade I.','Dysfonction diastolique de grade II':'Dysfonction diastolique de grade II.','Dysfonction diastolique de grade III':'Dysfonction diastolique de grade III.','Fonction diastolique indéterminée':'Fonction diastolique indéterminée.'},fill:{'Pressions de remplissage normales':'Pressions de remplissage normales.','Pressions de remplissage élevées':'Pressions de remplissage élevées.','Pressions de remplissage indéterminées':'Pressions de remplissage indéterminées.'},aorta:{'Dimensions normales':'Racine aortique et partie débutante de l’aorte ascendante tubulaire de dimensions normales.','Dilatée':'Racine aortique et/ou aorte ascendante tubulaire dilatée.','Mal visualisée':'Racine aortique et aorte ascendante tubulaire mal visualisées.'}};if(m[id]?.[x])return m[id][x];if(['lvType','avm','avo','avs','avr','mvm','mvv','mvo','mvs','mvr','tvm','tvo','tvr','tvs','pvm','pvo','pvr','pvs','eff','loc','flow','tam'].includes(id))return x+'.';if(id==='efv')return `FEVG visuellement estimée à ${x}.`;if(id==='inflow')return `Flux mitral : ${x.toLowerCase()}.`;if(id==='ee')return `E/e’ à ${x}.`;if(id==='root')return `Diamètre de la racine aortique à ${x} mm.`;if(id==='asc')return `Diamètre de l’aorte ascendante tubulaire à ${x} mm.`;if(id==='z')return `Z-score aortique à ${x}.`;if(id==='la')return `Oreillette gauche ${x.toLowerCase()}.`;if(id==='ra')return `Oreillette droite ${x.toLowerCase()}.`;if(id==='laa')return `Surface planimétrique de l’oreillette gauche : ${x} cm².`;if(id==='lav')return `Volume indexé de l’oreillette gauche : ${x} mL/m².`;if(id==='raa')return `Surface planimétrique de l’oreillette droite : ${x} cm².`;if(id==='rav')return `Volume indexé de l’oreillette droite : ${x} mL/m².`;if(id==='rv'||id==='rvf')return x+'.';if(id==='paps')return `PAPs estimée à ${x} mmHg.`;if(id==='php')return `${x} d’hypertension pulmonaire.`;if(id==='ivd')return `Diamètre de la VCI : ${x} mm.`;if(id==='ivc')return `Collapsus inspiratoire de la VCI ${x}.`;if(id==='rap')return `Pression de l’oreillette droite estimée à ${x}.`;if(['avvis','mvvis','tvvis','pvvis','ivvis','pervis'].includes(id))return x==='Visualisation satisfaisante'?x+'.':x+'.';return x+'.'}
function generate(){let a=[];S.forEach(sec=>sec[1].forEach(f=>{let x=v(f[0]);if(!x)return;if(f[0]==='efv'&&v('ef')){let i=a.findIndex(z=>z.startsWith('La fonction ventriculaire gauche'));if(i>=0)a[i]=a[i].replace(/\.$/,'')+', avec une FEVG visuellement estimée à '+x+'.';else a.push(line(f[0],x));}else a.push(line(f[0],x))}));report.textContent=a.join('\n')||'Aucun élément renseigné.';conclusion.textContent=makeConclusion()}
function makeConclusion(){let c=[];if(v('ef'))c.push(v('ef')+(v('efv')?' à '+v('efv'):'' )+'.');if(v('lvSize')&&v('lvSize')!=='De taille normale'&&v('lvSize')!=='Mal visualisé')c.push('VG '+v('lvSize').toLowerCase()+'.');if(v('lvWall')==='Hypertrophie du VG')c.push((v('lvType')||'Hypertrophie du VG')+'.');if(v('dia'))c.push(v('dia')+(v('fill')?' avec '+v('fill').toLowerCase():'')+'.');let ab=['avs','avr','mvs','mvr','tvr','tvs','pvr','pvs'].map(v).filter(x=>x&&!x.startsWith('Absence'));if(ab.length)c.push(ab.slice(0,3).join('; ')+'.');if(v('rvf'))c.push(v('rvf')+'.');if(v('php'))c.push(v('php')+' d’hypertension pulmonaire.');if(v('eff')&&v('eff')!=='Absence d’épanchement péricardique')c.push(v('eff')+'.');if(v('tam')==='Tamponnade')c.push('Tamponnade.');return c.slice(0,5).join(' ')||'Aucune conclusion automatique : renseignez les éléments pertinents du bilan.'}
function copyAll(){navigator.clipboard.writeText('COMPTE-RENDU\n\n'+report.textContent+'\n\nCONCLUSION\n\n'+conclusion.textContent).then(()=>alert('Rapport copié.'))}function downloadTxt(){let t='COMPTE-RENDU\n\n'+report.textContent+'\n\nCONCLUSION\n\n'+conclusion.textContent,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='EchoReport.txt';a.click()}reset.onclick=()=>confirm('Réinitialiser tous les champs ?')&&location.reload();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
